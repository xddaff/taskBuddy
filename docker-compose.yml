services:
  postgres:
    image: postgres:17-alpine
    container_name: studentproj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studentproj
      POSTGRES_PASSWORD: studentproj
      POSTGRES_DB: studentproj
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentproj -d studentproj"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
